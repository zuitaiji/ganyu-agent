[package]
name = "ganyu-agent"
version = "0.1.0"
edition = "2021"
description = "有温度、能自进化、可拓展、可自愈的完备 agent 系统（Rust）。会话UUID + 统一字符串值 + 抽象层。"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
thiserror = "1"
regex = "1"

# 联网后端（真实 LLM / OpenViking）默认关闭，避免引入 TLS/C 编译依赖。
# 开启：cargo run --features network
[dependencies.reqwest]
version = "0.12"
optional = true
default-features = false
features = ["json", "rustls-tls"]

[features]
default = []
network = ["dep:reqwest"]

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
